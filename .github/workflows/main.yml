
name: Windows All-in-One Workspace

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Select operation"
        required: true
        type: choice
        default: full
        options:
          - full
          - setup
          - backup
          - restore

      restore_run_id:
        description: "Previous GitHub Run ID"
        required: false
        type: string

      artifact_name:
        description: "Exact backup artifact name"
        required: false
        type: string

      enable_tailscale:
        description: "Enable private Tailscale network"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  windows-workspace:
    name: Windows Workspace Manager
    runs-on: windows-latest
    timeout-minutes: 45

    steps:

      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Initialize workspace
      - name: Initialize Workspace
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "WindowsWorkspace"

          New-Item -ItemType Directory -Force `
            -Path $workspace | Out-Null

          $source = Join-Path $env:GITHUB_WORKSPACE "workspace"

          if (Test-Path $source) {
            Get-ChildItem $source -Force |
              Copy-Item -Destination $workspace `
                -Recurse -Force
          }

          Write-Host "Workspace initialized."

      # 3. Validate restore
      - name: Validate Restore
        if: ${{ inputs.operation == 'restore' || (inputs.operation == 'full' && inputs.restore_run_id != '') }}
        shell: pwsh
        env:
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RESTORE_RUN_ID)) {
            throw "Previous Run ID is required."
          }

          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_NAME)) {
            throw "Artifact name is required."
          }

      # 4. Restore backup
      - name: Restore Previous Backup
        if: ${{ inputs.operation == 'restore' || (inputs.operation == 'full' && inputs.restore_run_id != '') }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/WindowsWorkspace
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.restore_run_id }}

      # 5. Install applications
      - name: Install Applications
        if: ${{ inputs.operation == 'setup' || inputs.operation == 'full' }}
        shell: pwsh
        run: |
          $apps = @(
            "Git.Git",
            "Microsoft.VisualStudioCode",
            "Google.Chrome",
            "7zip.7zip",
            "VideoLAN.VLC",
            "Python.Python.3.13"
          )

          $failed = @()

          foreach ($app in $apps) {
            Write-Host "Installing $app"

            winget install `
              --id $app `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              $failed += $app
              Write-Warning "Failed: $app"
            }
          }

          if ($failed.Count -gt 0) {
            Write-Warning "Some applications failed."
            $failed | ForEach-Object {
              Write-Warning $_
            }
          }

      # 6. Configure Tailscale
      - name: Configure Tailscale
        if: ${{ inputs.enable_tailscale }}
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $msi = Join-Path $env:TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $msi

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /quiet /norestart" `
            -Wait

          Remove-Item $msi -Force

          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $exe)) {
            throw "Tailscale installation failed."
          }

          Start-Service Tailscale `
            -ErrorAction SilentlyContinue

          & $exe up `
            "--authkey=$env:TS_AUTHKEY" `
            "--hostname=github-$env:GITHUB_RUN_ID" `
            "--accept-dns=false" `
            "--accept-routes=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Write-Host "Tailscale connected."

          & $exe ip -4

      # 7. Windows diagnostics
      - name: Windows Diagnostics
        shell: pwsh
        run: |
          Write-Host "Windows Information"

          Get-ComputerInfo |
            Select-Object WindowsProductName,
                          WindowsVersion,
                          OsArchitecture

          Write-Host "Network Information"

          Get-NetIPConfiguration |
            Select-Object InterfaceAlias,
                          IPv4Address

          Write-Host "Disk Information"

          Get-PSDrive -PSProvider FileSystem

          Write-Host "Installed Tools"

          git --version

          python --version

      # 8. Prepare backup
      - name: Prepare Backup
        if: ${{ inputs.operation != 'setup' }}
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "WindowsWorkspace"

          $info = @"
          Windows Workspace Backup
          Date: $(Get-Date -Format o)
          Repository: $env:GITHUB_REPOSITORY
          Run ID: $env:GITHUB_RUN_ID
          Operation: ${{ inputs.operation }}
          "@

          $info | Out-File `
            (Join-Path $workspace "backup-info.txt")

          Write-Host "Backup prepared."

      # 9. Upload backup
      - name: Save Workspace Backup
        if: ${{ inputs.operation != 'setup' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/WindowsWorkspace/
          retention-days: 30
          if-no-files-found: error

      # 10. Final report
      - name: Generate Report
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          @"
          # Windows Workspace Report

          Repository: $env:GITHUB_REPOSITORY
          Run ID: $env:GITHUB_RUN_ID
          Operation: ${{ inputs.operation }}
          Result: $env:JOB_STATUS
          Date: $(Get-Date -Format o)
          "@ | Out-File $env:GITHUB_STEP_SUMMARY

          Write-Host "Workspace workflow finished."
