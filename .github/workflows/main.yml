      - name: Git config
        shell: pwsh
        run: |
          git config user.name "vps-bot"
          git config user.email "vps-bot@users.noreply.github.com"

      - name: Keep alive, auto-save and Telegram bot
        shell: pwsh
        run: |
          . C:\tg.ps1

          $count = [int]$env:RESTART_COUNT
          $maxRestarts = [int]$env:MAX_RESTARTS

          # ignorer les commandes envoyées avant le démarrage de ce serveur
          $offset = 0
          $startDt = [datetime]::Parse($env:START_TIME, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)
          $startEpoch = ([DateTimeOffset]$startDt).ToUnixTimeSeconds()

          $lastSave = Get-Date
          $lastStatus = Get-Date
          $lastBackupTime = Get-Date
          $lastPass = Get-Date
          $lastRdp = Get-Date
          $warned = @{}
          $autoRestart = $true
          $restarted = $false
          $polling = $true
          $stopAt = $null
          $idleLimit = 90
          $idleWarned = $false
          $passEveryMin = 0
          $rdpWas = $false
          $tsWas = $true
          $ramAlert = $false
          $diskAlert = $false
          $settingsRestored = $false
          $watch = @('Rscript', 'Rterm', 'python', 'rsession')
          $procUp = @{}
          $tick = 0
          $offNow = $false

          Send-TG "🟢 البوت يسمع الأوامر دابا. اكتب /help"

          while ((Get-LeftMin) -gt 0) {
            Start-Sleep -Seconds 20
            $tick++
            try {

            if ($stopAt -and (Get-Date) -ge $stopAt) {
              Save-Work "final-before-stop"
              Send-TG "🛑 هذا السيرفر يتسكر دابا. خدّم السيرفر الجديد."
              break
            }

            # ---------- commandes Telegram ----------
            if ($polling) {
              try {
                $r = Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/getUpdates?offset=$offset&timeout=0&allowed_updates=%5B%22message%22%2C%22callback_query%22%5D"
                foreach ($u in $r.result) {
                  $offset = $u.update_id + 1
                  if ($u.callback_query) {
                    $cq = $u.callback_query
                    if ("$($cq.message.chat.id)" -ne "$env:TG_CHAT_ID") { continue }
                    Answer-Callback $cq.id
                    if (@('status', 'speed', 'save', 'screenshot', 'time', 'info', 'menu') -notcontains "$($cq.data)") { continue }
                    $cmd = '/' + "$($cq.data)"
                    $arg = ''
                  } else {
                    if ($u.message.date -lt $startEpoch) { continue }
                    if ("$($u.message.chat.id)" -ne "$env:TG_CHAT_ID") { continue }
                    $text = "$($u.message.text)".Trim()
                    if (-not $text.StartsWith('/')) { continue }
                    $parts = $text -split '\s+', 2
                    $cmd = ($parts[0] -split '@')[0].ToLower()
                    $arg = if ($parts.Count -gt 1) { $parts[1].Trim() } else { '' }
                  }
                  try {
                    switch ($cmd) {
                      '/help'       { Send-TG $helpText }
                      '/info'       { Send-TG (Get-Info) }
                      '/status'     { Send-TGButtons (Get-Status) @("⚡ قياس السرعة;speed|🔄 تحديث;status") }
                      '/speed'      { Send-TG "⏳ نقيس السرعة، ياخذ حوالي 20 ثانية..."; Send-Speed }
                      '/ping'       { Send-TG "⏳ نقيس السرعة، ياخذ حوالي 20 ثانية..."; Send-Speed }
                      '/menu'       { Send-TGButtons "🎛️ لوحة التحكم" @("📊 الحالة;status|⚡ قياس السرعة;speed", "💾 حفظ الآن;save|📸 صورة الشاشة;screenshot", "ℹ️ معلومات الدخول;info|⏳ الوقت;time") }
                      '/time'       { Send-TG "⏳ باقي $(Get-LeftMin) دقيقة" }
                      '/errors'     {
                        if ($global:ErrLog.Count -eq 0) { Send-TG "✅ ما كاين حتى خطأ مسجّل." }
                        else { Send-TG ("📋 آخر الأخطاء:`n" + ($global:ErrLog -join "`n")) }
                      }
                      '/save'       { Save-Work "manual-save" }
                      '/backup'     { Send-Backup "📦 نسخة احتياطية يدوية" $true }
                      '/files'      { Send-FilesCmd $arg }
                      '/screenshot' { Send-Screenshot }
                      '/setkey' {
                        try { Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/deleteMessage" -Method Post -Body @{ chat_id = $env:TG_CHAT_ID; message_id = $u.message.message_id } | Out-Null } catch { }
                        if (-not $env:GH_PAT) { Send-TG "❌ السر GH_PAT ناقص في GitHub." }
                        elseif ($arg -notmatch '^tskey-[A-Za-z0-9_-]{10,200}$') { Send-TG "❌ المفتاح غير صالح. الشكل: /setkey tskey-auth-xxxx" }
                        else {
                          python -m pip install --quiet pynacl 2>&1 | Out-Null
                          $o = ($arg | python C:\setsecret.py TAILSCALE_AUTH_KEY 2>&1 | Out-String).Trim().Replace($arg, '***')
                          if ($o -eq 'ok') { Send-TG "✅ تم حفظ TAILSCALE_AUTH_KEY (ومسحت رسالتك). السيرفرات الجاية تستعملو." }
                          else { Send-TG "❌ فشل حفظ المفتاح: $o`nتأكد أن GH_PAT فيه صلاحية Secrets: Read and write." }
                        }
                      }
                      '/install'    { Install-Apps $arg }
                      '/run' {
                        if (-not $arg) { Send-TG "اكتب الأمر بعد /run، مثال: /run Get-Date" }
                        else {
                          $res = Invoke-Timed { param($c) Set-Location $env:GITHUB_WORKSPACE; Invoke-Expression $c 2>&1 | Out-String } @($arg) 90
                          $res = ($res | Out-String).Trim()
                          if (-not $res) { $res = "(ما كاين حتى نتيجة)" }
                          Send-TG "💻 $res"
                        }
                      }
                      '/newpass' {
                        if ($arg -match '^auto\s+(\d+)$') {
                          $hours = [int]$Matches[1]
                          $passEveryMin = $hours * 60
                          $lastPass = Get-Date
                          Send-TG "🔑 كلمة السر تتبدّل تلقائيا كل $hours ساعات."
                        }
                        elseif ($arg -match '^auto\s+off$') { $passEveryMin = 0; Send-TG "🔑 التغيير التلقائي توقف." }
                        else {
                          $np = New-RdpPassword
                          $lastPass = Get-Date
                          Send-TG "🔑 كلمة سر جديدة:`nUser: RDP`nPass: $np"
                        }
                      }
                      '/idle' {
                        if ($arg -eq 'off') { $idleLimit = 0; Send-TG "😴 الإغلاق عند عدم الاتصال: متوقف." }
                        elseif ($arg -eq 'on') { $idleLimit = 90; $lastRdp = Get-Date; $idleWarned = $false; Send-TG "😴 نسكّر السيرفر إذا ما كاينش اتصال RDP لمدة 90 دقيقة." }
                        elseif ($arg -match '^\d+$' -and [int]$arg -ge 15) { $idleLimit = [int]$arg; $lastRdp = Get-Date; $idleWarned = $false; Send-TG "😴 نسكّر السيرفر إذا ما كاينش اتصال RDP لمدة $idleLimit دقيقة." }
                        else { Send-TG "الاستعمال: /idle off أو /idle on أو /idle 120 (دقايق، 15 على الأقل)" }
                      }
                      '/watch' {
                        if ($arg) {
                          $wn = ($arg -replace '\.exe$', '').Trim()
                          if ($watch -notcontains $wn) { $watch += $wn }
                        }
                        Send-TG "👀 نراقب: $($watch -join ', ')`nزيد: /watch اسم_البرنامج"
                      }
                      '/unwatch' {
                        $wn = ($arg -replace '\.exe$', '').Trim()
                        $watch = @($watch | Where-Object { $_ -ne $wn })
                        $procUp.Remove($wn)
                        Send-TG "👀 نراقب: $($watch -join ', ')"
                      }
                      '/stop' {
                        $autoRestart = $false
                        Send-TG "⏹️ التشغيل التلقائي توقف. السيرفر ما يعاودش يتشغل بعد ما يخلص الوقت."
                      }
                      '/restart' {
                        Save-Work "pre-restart-save"
                        $restarted = $true
                        if (Start-NewRun 0) {
                          $polling = $false
                          $stopAt = (Get-Date).AddMinutes(15)
                          Send-TG "🔁 تم تشغيل سيرفر جديد. تجيك رسالة بمعلومات الدخول الجديدة بعد حوالي 10 دقايق. هذا السيرفر يتسكر بعد 15 دقيقة، والأوامر تخدم من الجديد."
                        }
                      }
                      '/off' {
                        $autoRestart = $false
                        Save-Work "manual-off"
                        Send-TG "🛑 نسكّر هذا السيرفر دابا."
                        $offNow = $true
                      }
                    }
                  } catch { Report-Error "الأمر $cmd" $_ }
                }
              } catch { Report-Error 'قراءة أوامر تلجرام' $_ }
              if ($offNow) { break }
            }

            # ---------- RDP ----------
            $rdpNow = Get-Rdp
            if ($rdpNow) { $lastRdp = Get-Date; $idleWarned = $false }
            if ($rdpNow -and -not $rdpWas) { Send-TG "🟢 واحد دخل لـ RDP"; Add-Stat 'rdp' 1 }
            if (-not $rdpNow -and $rdpWas) { Send-TG "🔴 خرج من RDP" }
            $rdpWas = $rdpNow

            # restauration des réglages + ouverture des derniers fichiers (une seule fois)
            if (-not $settingsRestored -and $rdpNow -and (Test-Path 'C:\Users\RDP\AppData')) {
              $settingsRestored = $true
              Restore-Settings
              Open-LastFiles
            }

            # ---------- Tailscale ----------
            $tsNow = [bool](& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null | Select-Object -First 1)
            if (-not $tsNow -and $tsWas) { Send-TG "⚠️ Tailscale تقطع! ما تقدرش تدخل للسيرفر." }
            if ($tsNow -and -not $tsWas) { Send-TG "✅ Tailscale رجع." }
            $tsWas = $tsNow

            # ---------- RAM / disque / programmes surveillés (chaque ~1 min) ----------
            if ($tick % 3 -eq 0) {
              $os = Get-CimInstance Win32_OperatingSystem
              $ram = [int](100 * (1 - $os.FreePhysicalMemory / $os.TotalVisibleMemorySize))
              $dsk = Get-PSDrive C
              $disk = [int](100 * $dsk.Used / ($dsk.Used + $dsk.Free))
              if ($ram -ge 90 -and -not $ramAlert) { $ramAlert = $true; Send-TG "⚠️ RAM وصلت $ram%" }
              if ($ram -lt 80) { $ramAlert = $false }
              if ($disk -ge 90 -and -not $diskAlert) { $diskAlert = $true; Send-TG "⚠️ القرص C وصل $disk%" }
              if ($disk -lt 80) { $diskAlert = $false }

              foreach ($wn in $watch) {
                $up = [bool](Get-Process -Name $wn -ErrorAction SilentlyContinue)
                if ($procUp.ContainsKey($wn) -and $procUp[$wn] -and -not $up) { Send-TG "🛑 البرنامج وقف أو كمّل: $wn" }
                $procUp[$wn] = $up
              }
            }

            # ---------- sauvegarde auto toutes les 5 minutes ----------
            if (((Get-Date) - $lastSave).TotalMinutes -ge 5) {
              Save-Work "auto-save"
              $lastSave = Get-Date
            }

            # ---------- rapport d'état toutes les 30 minutes ----------
            if (((Get-Date) - $lastStatus).TotalMinutes -ge 30) {
              Send-TG (Get-Status)
              $lastStatus = Get-Date
            }

            # ---------- copie zip dans Telegram chaque heure (si changement) ----------
            if (((Get-Date) - $lastBackupTime).TotalMinutes -ge 60) {
              Send-Backup "📦 نسخة احتياطية (كل ساعة)" $false
              $lastBackupTime = Get-Date
            }

            # ---------- changement automatique du mot de passe ----------
            if ($passEveryMin -gt 0 -and ((Get-Date) - $lastPass).TotalMinutes -ge $passEveryMin) {
              $np = New-RdpPassword
              $lastPass = Get-Date
              Send-TG "🔑 كلمة السر تبدّلت تلقائيا:`nUser: RDP`nPass: $np"
            }

            # ---------- arrêt si personne n'est connecté ----------
            if ($idleLimit -gt 0) {
              $idle = ((Get-Date) - $lastRdp).TotalMinutes
              if ($idle -ge $idleLimit) {
                $autoRestart = $false
                Save-Work "idle-stop"
                Send-TG "😴 ما كانش حد متصل $([int]$idle) دقيقة. حفظت الملفات وسكّرت السيرفر باش ما نضيّعش الدقايق. اكتب /restart باش تشغّل جديد."
                break
              }
              elseif ($idle -ge ($idleLimit - 10) -and -not $idleWarned) {
                $idleWarned = $true
                Send-TG "⏳ ما كاينش حد متصل. بعد 10 دقايق نسكّر السيرفر. ادخل بـ RDP ولا اكتب /idle off"
              }
            }

            # ---------- alertes avant la fin ----------
            $left = Get-LeftMin
            foreach ($m in 30, 10, 5) {
              if ($left -le $m -and -not $warned[$m]) {
                $warned[$m] = $true
                Send-TG "⏰ باقي تقريبا $m دقيقة ويتسكر السيرفر. حفظ الملفات رايح يتدار تلقائيا."
              }
            }

            # ---------- redémarrage automatique ----------
            if ($autoRestart -and -not $restarted -and $left -le 15) {
              $restarted = $true
              Save-Work "pre-restart-save"
              if ($count -lt $maxRestarts) {
                if (Start-NewRun ($count + 1)) {
                  $polling = $false
                  Send-TG "🔁 تم تشغيل سيرفر جديد تلقائيا (رقم $($count + 2) من $($maxRestarts + 1)). يوجد بعد حوالي 10 دقايق وتجيك رسالة بمعلومات الدخول الجديدة. هذا السيرفر يبقى خدّام حوالي 15 دقيقة، والأوامر تخدم من الجديد."
                }
              } else {
                Send-TG "⛔ وصلنا الحد الأقصى للتشغيل التلقائي ($($maxRestarts + 1) مرات). ما نعاودش نشغّل. اكتب /restart باش تشغّل يدويا."
              }
            }
            } catch { Report-Error 'الحلقة الرئيسية' $_ }
          }

      - name: Report failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path C:\tg.ps1) { . C:\tg.ps1 }
          else {
            function Send-TG($t) {
              try { Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/sendMessage" -Method Post -Body @{ chat_id = $env:TG_CHAT_ID; text = $t } | Out-Null } catch { }
            }
          }
          $url = "https://github.com/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)"
          try {
            $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
            $base = "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)"
            $jobs = Invoke-RestMethod -Uri "$base/actions/runs/$($env:GITHUB_RUN_ID)/jobs" -Headers $h
            $job = $jobs.jobs | Select-Object -First 1
            $failed = @($job.steps | Where-Object { $_.conclusion -eq 'failure' } | ForEach-Object { $_.name })
            $ann = @()
            try {
              $ann = @(Invoke-RestMethod -Uri "$base/check-runs/$($job.id)/annotations" -Headers $h |
                Where-Object { $_.annotation_level -eq 'failure' } | ForEach-Object { $_.message })
            } catch { }
            $txt = "❌ صرا خطأ في التشغيل`nالخطوة لي فشلت: $($failed -join ', ')"
            if ($ann.Count -gt 0) { $txt += "`n" + (($ann | Select-Object -Unique -First 5) -join "`n") }
            Send-TG "$txt`n$url"
          } catch {
            Send-TG "❌ صرا خطأ في التشغيل. شوف التفاصيل:`n$url"
          }

      - name: Final save
        if: always()
        shell: pwsh
        run: |
          . C:\tg.ps1
          Save-Work "final-save"
          Send-Report
          Send-TG "🛑 هذا السيرفر تسكر. آخر حفظ تدار."
