name: Windows VPS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vps:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Restore files
        uses: actions/checkout@v4

      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "RDP-3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force

      - name: Create RDP user
        shell: pwsh
        run: |
          $chars = (48..57) + (65..90) + (97..122)
          $password = (-join ((1..16 | ForEach-Object { [char]($chars | Get-Random) }))) + "!aA1"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          "RDP_PASS=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Tailscale
        shell: pwsh
        run: choco install tailscale -y --no-progress

      - name: Connect Tailscale
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          Start-Sleep -Seconds 10
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-${{ github.run_id }} --unattended
          $ip = $null
          for ($i = 0; $i -lt 12 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) { Write-Error "Tailscale IP not assigned"; exit 1 }
          "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show access info
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============== RDP ACCESS ==============="
          Write-Host "Address:  $env:TS_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "Work folder: ${{ github.workspace }}"
          Write-Host "=========================================="

      - name: Install apps
        shell: pwsh
        continue-on-error: true
        run: |
          choco install googlechrome firefox microsoft-edge r.project rstudio vscode git 7zip python notepadplusplus vlc -y --no-progress

      - name: Desktop shortcut
        shell: pwsh
        continue-on-error: true
        run: |
          $shell = New-Object -ComObject WScript.Shell
          $lnk = $shell.CreateShortcut("C:\Users\Public\Desktop\MY WORK.lnk")
          $lnk.TargetPath = "${{ github.workspace }}"
          $lnk.Save()

      - name: Git config
        shell: pwsh
        run: |
          git config user.name "vps-bot"
          git config user.email "vps-bot@users.noreply.github.com"

      - name: Keep alive and auto-save
        shell: pwsh
        run: |
          Write-Host "Address:  $env:TS_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASS"
          $end = (Get-Date).AddMinutes(345)
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 300
            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "auto-save $(Get-Date -Format s)"
              git pull --rebase
              git push
            }
          }

      - name: Final save
        if: always()
        shell: pwsh
        run: |
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "final-save"
            git pull --rebase
            git push
          }
