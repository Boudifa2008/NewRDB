name: Windows VPS

on:
  workflow_dispatch:
    inputs:
      restart_count:
        description: "Internal counter (leave as is)"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write
  checks: read

env:
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_PAT: ${{ secrets.GH_PAT }}
  RESTART_COUNT: ${{ inputs.restart_count || '0' }}
  MAX_RESTARTS: "3"

jobs:
  vps:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Restore files
        uses: actions/checkout@v4

      - name: Telegram helper
        shell: pwsh
        run: |
          $end = (Get-Date).ToUniversalTime().AddMinutes(345).ToString("o")
          $start = (Get-Date).ToUniversalTime().ToString("o")
          "END_TIME=$end" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "START_TIME=$start" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          @'
          # ============ Telegram helper ============
          $SettingsMap = @(
            @{ n = 'vscode-settings.json';    p = 'C:\Users\RDP\AppData\Roaming\Code\User\settings.json' },
            @{ n = 'vscode-keybindings.json'; p = 'C:\Users\RDP\AppData\Roaming\Code\User\keybindings.json' },
            @{ n = 'rstudio-prefs.json';      p = 'C:\Users\RDP\AppData\Roaming\RStudio\rstudio-prefs.json' },
            @{ n = 'chrome-bookmarks.json';   p = 'C:\Users\RDP\AppData\Local\Google\Chrome\User Data\Default\Bookmarks' },
            @{ n = 'terminal-settings.json';  p = 'C:\Users\RDP\AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json' }
          )
          $CodeCli = 'C:\Program Files\Microsoft VS Code\bin\code.cmd'
          $CodeExtDir = 'C:\Users\RDP\.vscode\extensions'

          $helpText = @(
            '🟢 السيرفر خدّام. الأوامر:',
            '/info - IP واسم المستخدم وكلمة السر',
            '/status - حالة السيرفر',
            '/time - الوقت لي باقي',
            '/speed - قياس سرعة السيرفر (فيه زر)',
            '/menu - لوحة أزرار سريعة',
            '/errors - آخر الأخطاء لي صرات',
            '/setkey tskey-... - تبديل مفتاح Tailscale',
            '/save - حفظ الملفات في GitHub الآن',
            '/backup - نسخة zip من MY WORK تجيك في تلجرام',
            '/files - قائمة الملفات | /files اسم - يبعثلك ملف ولا مجلد',
            '/screenshot - صورة لشاشة السيرفر',
            '/run أمر - ينفّذ أمر PowerShell ويبعثلك النتيجة',
            '/install اسم - تثبيت تطبيق بـ choco',
            '/newpass - كلمة سر جديدة | /newpass auto 3 (كل 3 ساعات) | /newpass auto off',
            '/idle off - /idle 120 - /idle on : الإغلاق عند عدم الاتصال',
            '/watch اسم - /unwatch اسم : مراقبة برنامج',
            '/restart - تشغيل سيرفر جديد',
            '/stop - إيقاف التشغيل التلقائي',
            '/off - حفظ وإغلاق هذا السيرفر الآن'
          ) -join "`n"

          function Send-TG($text) {
            try {
              if ($text.Length -gt 4000) { $text = $text.Substring(0, 4000) + "…" }
              Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/sendMessage" -Method Post -Body @{ chat_id = $env:TG_CHAT_ID; text = $text } | Out-Null
            } catch { Write-Host "Telegram error" }
          }

          $global:ErrLog = @()
          $global:ErrSeen = @{}

          function Report-Error($where, $err) {
            $msg = "$($err.Exception.Message)".Trim()
            if ($env:TG_BOT_TOKEN) { $msg = $msg.Replace($env:TG_BOT_TOKEN, '***') }
            $global:ErrLog += "[$(Get-Date -Format 'HH:mm')] ${where}: $msg"
            if ($global:ErrLog.Count -gt 20) { $global:ErrLog = $global:ErrLog[-20..-1] }
            $key = "$where|$msg"
            if (-not $global:ErrSeen.ContainsKey($key) -or ((Get-Date) - $global:ErrSeen[$key]).TotalMinutes -ge 30) {
              $global:ErrSeen[$key] = Get-Date
              Send-TG "⚠️ خطأ في ${where}:`n$msg"
            }
          }

          function Send-TGFile($path, $caption) {
            try {
              $item = Get-Item -LiteralPath $path -ErrorAction Stop
              if ($item.Length -gt 49MB) {
                Send-TG "⚠️ الملف كبير بزاف ($([math]::Round($item.Length / 1MB)) MB). تلجرام يقبل حتى 50MB فقط."
                return $false
              }
              Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/sendDocument" -Method Post -Form @{ chat_id = $env:TG_CHAT_ID; caption = $caption; document = $item } | Out-Null
              return $true
            } catch { Send-TG "❌ فشل إرسال الملف"; return $false }
          }

          function Send-TGPhoto($path, $caption) {
            try {
              $item = Get-Item -LiteralPath $path -ErrorAction Stop
              Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/sendPhoto" -Method Post -Form @{ chat_id = $env:TG_CHAT_ID; caption = $caption; photo = $item } | Out-Null
            } catch { [void](Send-TGFile $path $caption) }
          }

          function Send-TGButtons($text, $rows) {
            $kbRows = New-Object System.Collections.ArrayList
            foreach ($row in $rows) {
              $btns = New-Object System.Collections.ArrayList
              foreach ($item in ($row -split '\|')) {
                $p = $item -split ';', 2
                [void]$btns.Add(@{ text = $p[0]; callback_data = $p[1] })
              }
              [void]$kbRows.Add($btns)
            }
            $markup = @{ inline_keyboard = $kbRows } | ConvertTo-Json -Depth 6 -Compress
            try {
              Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/sendMessage" -Method Post -Body @{ chat_id = $env:TG_CHAT_ID; text = $text; reply_markup = $markup } | Out-Null
            } catch { Write-Host "Telegram error" }
          }

          function Answer-Callback($id) {
            try { Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/answerCallbackQuery" -Method Post -Body @{ callback_query_id = $id } | Out-Null } catch { }
          }

          function Measure-Ms([scriptblock]$sb) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            try { & $sb | Out-Null; return [int]$sw.ElapsedMilliseconds } catch { return -1 }
          }

          function Get-AvgMs([scriptblock]$sb, $n = 3) {
            $vals = @()
            for ($i = 0; $i -lt $n; $i++) { $v = Measure-Ms $sb; if ($v -ge 0) { $vals += $v } }
            if ($vals.Count -eq 0) { return -1 }
            return [int](($vals | Measure-Object -Average).Average)
          }

          function Fmt-Ms($v) { if ($v -lt 0) { "غير متاح" } else { "$v ms" } }

          function Send-Speed {
            $tgMs = Get-AvgMs { Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/getMe" -TimeoutSec 10 }
            $ghMs = Get-AvgMs { Invoke-WebRequest -Uri "https://github.com" -Method Head -TimeoutSec 10 -UseBasicParsing }
            $ggMs = Get-AvgMs { Invoke-WebRequest -Uri "https://www.google.com" -Method Head -TimeoutSec 10 -UseBasicParsing }
            $down = "غير متاح"; $up = "غير متاح"; $downVal = 0
            try {
              $size = 20000000
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $null = Invoke-WebRequest -Uri "https://speed.cloudflare.com/__down?bytes=$size" -TimeoutSec 40 -UseBasicParsing
              $sw.Stop()
              $downVal = [math]::Round($size * 8 / 1e6 / $sw.Elapsed.TotalSeconds)
              $down = "$downVal Mbps"
            } catch { }
            try {
              $buf = New-Object byte[] 8000000
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $null = Invoke-WebRequest -Uri "https://speed.cloudflare.com/__up" -Method Post -Body $buf -ContentType "application/octet-stream" -TimeoutSec 40 -UseBasicParsing
              $sw.Stop()
              $up = "$([math]::Round(8000000 * 8 / 1e6 / $sw.Elapsed.TotalSeconds)) Mbps"
            } catch { }
            $verdict = if ($downVal -ge 100 -and $tgMs -ge 0 -and $tgMs -lt 300) { "ممتازة" }
              elseif ($downVal -ge 30) { "مليحة" }
              elseif ($downVal -gt 0) { "ضعيفة" }
              else { "ما تقاسش" }
            Send-TGButtons ("⚡ سرعة السيرفر`nTelegram: $(Fmt-Ms $tgMs)`nGitHub: $(Fmt-Ms $ghMs)`nGoogle: $(Fmt-Ms $ggMs)`nتحميل (Download): $down`nرفع (Upload): $up`nالنتيجة: $verdict") @("🔁 أعد القياس;speed|📊 الحالة;status")
          }

          function Invoke-Timed([scriptblock]$sb, [object[]]$ArgList = @(), $sec = 60) {
            $j = Start-Job -ScriptBlock $sb -ArgumentList $ArgList
            if (Wait-Job $j -Timeout $sec) { $out = Receive-Job $j } else { Stop-Job $j; $out = "(timeout)" }
            Remove-Job $j -Force -ErrorAction SilentlyContinue
            return $out
          }

          function Add-Stat($k, $v) { Add-Content -Path "C:\stats.txt" -Value "$k,$v" }

          function Get-LeftMin {
            $end = [datetime]::Parse($env:END_TIME, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)
            [math]::Max(0, [int](($end - (Get-Date).ToUniversalTime()).TotalMinutes))
          }

          function Get-Rdp {
            try { return [bool]((quser 2>$null) -match 'rdp-tcp#') } catch { return $false }
          }

          function Get-Info {
            "🖥️ معلومات الدخول`nIP: $env:TS_IP`nUser: RDP`nPass: $env:RDP_PASS`n⏳ باقي: $(Get-LeftMin) دقيقة"
          }

          function Get-Status {
            $cpu = [int](Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average
            $os = Get-CimInstance Win32_OperatingSystem
            $ram = [int](100 * (1 - $os.FreePhysicalMemory / $os.TotalVisibleMemorySize))
            $free = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
            $rdp = if (Get-Rdp) { "متصل" } else { "ما كاينش حد" }
            $tsip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null | Select-Object -First 1
            $tsok = if ($tsip) { "شغّال" } else { "مقطوع ⚠️" }
            "📊 حالة السيرفر`nCPU: $cpu%`nRAM: $ram%`nالقرص C: فارغ $free GB`nTailscale: $tsok`nRDP: $rdp`n⏳ باقي: $(Get-LeftMin) دقيقة"
          }

          function Invoke-InSession([string]$code) {
            $f = 'C:\Users\Public\insession.ps1'
            Set-Content -Path $f -Value $code -Encoding utf8
            $tr = 'powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File ' + $f
            & schtasks.exe /create /tn VPSSession /tr $tr /sc once /st 00:00 /ru RDP /rp $env:RDP_PASS /it /rl highest /f 2>&1 | Out-Null
            & schtasks.exe /run /tn VPSSession 2>&1 | Out-Null
          }

          function New-RdpPassword {
            $chars = (48..57) + (65..90) + (97..122)
            $np = (-join ((1..16 | ForEach-Object { [char]($chars | Get-Random) }))) + "!aA1"
            Write-Host "::add-mask::$np"
            Set-LocalUser -Name "RDP" -Password (ConvertTo-SecureString $np -AsPlainText -Force)
            $env:RDP_PASS = $np
            return $np
          }

          function Start-NewRun($count) {
            try {
              $wf = [IO.Path]::GetFileName(($env:GITHUB_WORKFLOW_REF -split '@')[0])
              $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $body = @{ ref = $env:GITHUB_REF_NAME; inputs = @{ restart_count = "$count" } } | ConvertTo-Json -Depth 5
              Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/actions/workflows/$wf/dispatches" -Headers $headers -Body $body -ContentType "application/json" | Out-Null
              return $true
            } catch {
              Send-TG "❌ فشل التشغيل التلقائي: $($_.Exception.Message)"
              return $false
            }
          }

          function Backup-Settings($full) {
            if (-not (Test-Path 'C:\Users\RDP\AppData')) { return }
            $dir = Join-Path $env:GITHUB_WORKSPACE '.vps-settings'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            foreach ($m in $SettingsMap) {
              if (Test-Path -LiteralPath $m.p) { Copy-Item -LiteralPath $m.p -Destination (Join-Path $dir $m.n) -Force -ErrorAction SilentlyContinue }
            }
            $global:ExtTick = [int]$global:ExtTick + 1
            if ((Test-Path $CodeCli) -and (Test-Path $CodeExtDir) -and ($full -or ($global:ExtTick % 6 -eq 1))) {
              $exts = Invoke-Timed { param($c, $d) & $c --list-extensions --extensions-dir $d 2>$null } @($CodeCli, $CodeExtDir) 60
              $exts = @($exts | Where-Object { $_ -match '^[A-Za-z0-9_.-]+$' })
              if ($exts.Count -gt 0) { $exts | Set-Content (Join-Path $dir 'vscode-extensions.txt') }
            }
          }

          function Restore-Settings {
            $dir = Join-Path $env:GITHUB_WORKSPACE '.vps-settings'
            if (-not (Test-Path $dir)) { return }
            $n = 0
            foreach ($m in $SettingsMap) {
              $src = Join-Path $dir $m.n
              if ((Test-Path $src) -and -not (Test-Path -LiteralPath $m.p)) {
                New-Item -ItemType Directory -Force -Path (Split-Path $m.p) | Out-Null
                Copy-Item -LiteralPath $src -Destination $m.p -Force
                $n++
              }
            }
            $extFile = Join-Path $dir 'vscode-extensions.txt'
            if ((Test-Path $extFile) -and (Test-Path $CodeCli)) {
              $exts = @(Get-Content $extFile)
              Invoke-Timed { param($c, $d, $list) foreach ($e in $list) { & $c --install-extension $e --extensions-dir $d --force 2>&1 | Out-Null } } @($CodeCli, $CodeExtDir, $exts) 300 | Out-Null
              $n += $exts.Count
            }
            if ($n -gt 0) { Send-TG "⚙️ رجّعت إعدادات التطبيقات (VS Code, RStudio, Chrome, Terminal) و$($exts.Count) إضافة." }
          }

          function Update-LastFiles {
            $ws = $env:GITHUB_WORKSPACE
            $dir = Join-Path $ws '.vps-settings'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $files = Get-ChildItem -Path $ws -Recurse -File -Force -ErrorAction SilentlyContinue |
              Where-Object { ($_.Extension -in @('.R', '.Rmd', '.qmd', '.py', '.ipynb')) -and $_.FullName -notlike '*\.git\*' -and $_.FullName -notlike '*\.vps-settings\*' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 3
            if ($files) { $files | ForEach-Object { $_.FullName.Substring($ws.Length + 1) } | Set-Content (Join-Path $dir 'last-files.txt') }
          }

          function Open-LastFiles {
            $f = Join-Path $env:GITHUB_WORKSPACE '.vps-settings\last-files.txt'
            if (-not (Test-Path $f)) { return }
            $paths = @(Get-Content $f | ForEach-Object { Join-Path $env:GITHUB_WORKSPACE $_ } | Where-Object { Test-Path -LiteralPath $_ })
            if ($paths.Count -eq 0) { return }
            $editor = @('C:\Program Files\Microsoft VS Code\Code.exe', 'C:\Program Files\Notepad++\notepad++.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $editor) { $editor = 'notepad.exe' }
            $quoted = ($paths | ForEach-Object { '"' + $_ + '"' }) -join ' '
            $code = "Start-Process -FilePath '" + $editor.Replace("'", "''") + "' -ArgumentList '" + $quoted.Replace("'", "''") + "'"
            Invoke-InSession $code
            Send-TG "📂 فتحت لك آخر الملفات لي كنت تخدم عليها."
          }

          function Send-Backup($caption, $force) {
            $ws = $env:GITHUB_WORKSPACE
            $items = @(Get-ChildItem -LiteralPath $ws -Force | Where-Object { $_.Name -ne '.git' })
            if ($items.Count -eq 0) { if ($force) { Send-TG "📦 MY WORK خاوي." }; return }
            $newest = (Get-ChildItem -LiteralPath $ws -Recurse -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike '*\.git\*' } | Measure-Object LastWriteTime -Maximum).Maximum
            if (-not $force -and $global:LastBackup -and $newest -le $global:LastBackup) { return }
            $zip = "C:\Users\Public\backup-$(Get-Date -Format 'yyyyMMdd-HHmm').zip"
            try { Compress-Archive -LiteralPath $items.FullName -DestinationPath $zip -Force -ErrorAction Stop }
            catch { Send-TG "❌ فشل إنشاء النسخة الاحتياطية"; return }
            [void](Send-TGFile $zip $caption)
            $global:LastBackup = Get-Date
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
          }

          function Send-FilesCmd($arg) {
            $ws = $env:GITHUB_WORKSPACE
            if (-not $arg) {
              $items = @(Get-ChildItem -LiteralPath $ws -Force | Where-Object { $_.Name -ne '.git' } | Select-Object -First 40)
              if ($items.Count -eq 0) { Send-TG "📂 المجلد خاوي."; return }
              $lines = $items | ForEach-Object { if ($_.PSIsContainer) { "📁 $($_.Name)" } else { "📄 $($_.Name) ($([math]::Round($_.Length / 1KB)) KB)" } }
              Send-TG ("📂 محتوى MY WORK:`n" + ($lines -join "`n") + "`n`nاكتب /files اسم_الملف باش نبعثو.")
              return
            }
            $p = if ([IO.Path]::IsPathRooted($arg)) { $arg } else { Join-Path $ws $arg }
            if (-not (Test-Path -LiteralPath $p)) { Send-TG "❌ ما لقيتش: $arg"; return }
            $it = Get-Item -LiteralPath $p
            if ($it.PSIsContainer) {
              $zip = "C:\Users\Public\$($it.Name).zip"
              Compress-Archive -LiteralPath $it.FullName -DestinationPath $zip -Force
              [void](Send-TGFile $zip "📁 $($it.Name)")
              Remove-Item $zip -Force -ErrorAction SilentlyContinue
            } else {
              [void](Send-TGFile $it.FullName "📄 $($it.Name)")
            }
          }

          function Send-Screenshot {
            if (-not (Get-Rdp)) { Send-TG "📸 ما كاينش حد متصل بـ RDP، ما نقدرش ناخذ صورة."; return }
            $png = 'C:\Users\Public\shot.png'
            Remove-Item $png -Force -ErrorAction SilentlyContinue
            $lines = @(
              'Add-Type -AssemblyName System.Windows.Forms,System.Drawing',
              '$b = [System.Windows.Forms.SystemInformation]::VirtualScreen',
              '$bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height',
              '$g = [System.Drawing.Graphics]::FromImage($bmp)',
              '$g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)',
              '$bmp.Save("C:\Users\Public\shot.png")'
            )
            Invoke-InSession ($lines -join "`n")
            for ($i = 0; $i -lt 20 -and -not (Test-Path $png); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path $png) {
              Start-Sleep -Seconds 1
              Send-TGPhoto $png "📸 $(Get-Date -Format 'HH:mm')"
              Remove-Item $png -Force -ErrorAction SilentlyContinue
            } else { Send-TG "❌ ما قدرتش ناخذ الصورة." }
          }

          function Install-Apps($arg) {
            $names = @($arg -split '\s+' | Where-Object { $_ -match '^[A-Za-z0-9][A-Za-z0-9._-]*$' })
            if ($names.Count -eq 0) { Send-TG "❌ اكتب اسم صحيح، مثال: /install vlc"; return }
            foreach ($n in $names) {
              Send-TG "⏳ نثبّت $n ..."
              $out = choco install $n -y --no-progress 2>&1 | Out-String
              if (@(0, 1641, 3010) -contains $LASTEXITCODE) { Send-TG "✅ تثبّت $n" }
              else { Send-TG ("❌ فشل تثبيت $n`n" + (($out -split "`n" | Select-Object -Last 6) -join "`n")) }
            }
            Save-Work "apps-update"
          }

          function Save-Work($label) {
            Set-Location $env:GITHUB_WORKSPACE
            Backup-Settings ($label -ne 'auto-save')
            Update-LastFiles

            # fichiers > 90MB : exclus (limite GitHub = 100MB)
            Get-ChildItem -Recurse -File -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -gt 90MB -and $_.FullName -notlike '*\.git\*' } |
              ForEach-Object {
                $rel = $_.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1).Replace('\', '/')
                if (-not (Select-String -Path ".git/info/exclude" -Pattern ([regex]::Escape($rel)) -Quiet -ErrorAction SilentlyContinue)) {
                  Add-Content ".git/info/exclude" $rel
                  Send-TG "⚠️ ملف كبير ما تم رفعوش (أكبر من 90MB): $rel`nتنجم تبعثو بـ /files"
                }
              }

            # applications installées via choco depuis le début de la session
            if (Test-Path "C:\base-apps.txt") {
              $base = Get-Content "C:\base-apps.txt"
              $now = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Directory | ForEach-Object { $_.Name }
              $new = $now | Where-Object { $_ -notin $base }
              if ($new) {
                $old = if (Test-Path "extra-apps.txt") { @(Get-Content "extra-apps.txt") } else { @() }
                $added = @($new | Where-Object { $_ -notin $old })
                if ($added.Count -gt 0) {
                  ($old + $added | Where-Object { $_ } | Sort-Object -Unique) | Set-Content "extra-apps.txt"
                  foreach ($a in $added) { Add-Stat 'app' $a }
                  Send-TG "📦 تطبيقات جديدة تحفظت: $($added -join ', ')"
                }
              }
            }

            git add -A
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              $n = (git diff --cached --name-only | Measure-Object).Count
              git commit -m "$label $(Get-Date -Format s)" 2>&1 | Out-Null
              $pullOut = git pull --rebase 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) {
                git rebase --abort 2>&1 | Out-Null
                Send-TG ("⚠️ تعارض عند جلب التغييرات من GitHub، الحفظ تأجّل:`n" + (($pullOut.Trim() -split "`n" | Select-Object -Last 3) -join "`n"))
                return
              }
              $pushOut = git push 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0) { Add-Stat 'saved' $n; Send-TG "💾 تم الحفظ: $n ملف/ملفات" }
              else { Send-TG ("❌ فشل الرفع إلى GitHub:`n" + (($pushOut.Trim() -split "`n" | Select-Object -Last 3) -join "`n")) }
            }
          }

          function Send-Report {
            $st = [datetime]::Parse($env:START_TIME, [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind)
            $up = [int]((Get-Date).ToUniversalTime() - $st).TotalMinutes
            $rows = if (Test-Path "C:\stats.txt") { @(Get-Content "C:\stats.txt") } else { @() }
            $saves = $rows | Where-Object { $_ -like 'saved,*' } | ForEach-Object { [int](($_ -split ',')[1]) } | Measure-Object -Sum
            $apps = @($rows | Where-Object { $_ -like 'app,*' } | ForEach-Object { ($_ -split ',')[1] })
            $rdp = @($rows | Where-Object { $_ -like 'rdp,*' }).Count
            $appsTxt = if ($apps.Count -gt 0) { $apps -join ', ' } else { 'لا شيء' }
            Send-TG "📋 تقرير الجلسة`n⏱️ المدة: $up دقيقة`n💾 الحفظ: $($saves.Count) مرات ($([int]$saves.Sum) ملف)`n📦 تطبيقات جديدة: $appsTxt`n🔌 دخول RDP: $rdp مرات"
          }
          '@ | Set-Content -Path "C:\tg.ps1" -Encoding utf8

      - name: Write secret helper
        shell: pwsh
        run: |
          @'
          import base64, json, os, sys, urllib.request
          try:
              from nacl import encoding, public
              repo = os.environ["GITHUB_REPOSITORY"]
              pat = os.environ["GH_PAT"]
              name = sys.argv[1]
              value = sys.stdin.read().strip()

              def gh(method, path, body=None):
                  req = urllib.request.Request(
                      "https://api.github.com" + path,
                      data=json.dumps(body).encode() if body is not None else None,
                      method=method,
                      headers={"Authorization": "Bearer " + pat, "Accept": "application/vnd.github+json"},
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      txt = r.read().decode()
                      return json.loads(txt) if txt else {}

              pk = gh("GET", "/repos/" + repo + "/actions/secrets/public-key")
              key = public.PublicKey(pk["key"].encode(), encoding.Base64Encoder())
              sealed = public.SealedBox(key).encrypt(value.encode())
              gh("PUT", "/repos/" + repo + "/actions/secrets/" + name,
                 {"encrypted_value": base64.b64encode(sealed).decode(), "key_id": pk["key_id"]})
              print("ok")
          except Exception as e:
              print("error:", type(e).__name__, getattr(e, "code", ""))
          '@ | Set-Content -Path "C:\setsecret.py" -Encoding utf8

      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "RDP-3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any -ErrorAction SilentlyContinue
          Restart-Service -Name TermService -Force

      - name: Create RDP user
        shell: pwsh
        run: |
          $chars = (48..57) + (65..90) + (97..122)
          $password = (-join ((1..16 | ForEach-Object { [char]($chars | Get-Random) }))) + "!aA1"
          Write-Host "::add-mask::$password"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          "RDP_PASS=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Tailscale
        shell: pwsh
        run: choco install tailscale -y --no-progress

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          . C:\tg.ps1
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          Start-Sleep -Seconds 10
          $out = & $ts up "--authkey=$($env:TS_KEY)" "--hostname=gh-runner-${{ github.run_id }}" --unattended 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            if ($env:TS_KEY) { $out = $out.Replace($env:TS_KEY, '***') }
            $short = ($out.Trim() -split "`n" | Select-Object -Last 5) -join "`n"
            Send-TG "❌ فشل الاتصال بـ Tailscale`n$short`n`nإذا المفتاح منتهي أو غير صالح: ابعت للبوت تاع التحكم: /setkey tskey-... ثم /startvps"
            Write-Error "tailscale up failed"
            exit 1
          }
          $ip = $null
          for ($i = 0; $i -lt 12 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) {
            Send-TG "❌ Tailscale اتصل لكن ما عطاش IP"
            Write-Error "Tailscale IP not assigned"
            exit 1
          }
          "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Send access info
        shell: pwsh
        run: |
          . C:\tg.ps1
          $round = ([int]$env:RESTART_COUNT) + 1
          Send-TG ("✅ السيرفر واجد (تشغيل رقم $round)`n" + (Get-Info) + "`n(ماتنساش تفتح Tailscale على جهازك)`n`n⏳ نثبّت التطبيقات، والأوامر تبدأ تخدم بعد ما تخلص. اكتب /help`n😴 إذا ما دخلتش RDP في 90 دقيقة نسكّر السيرفر (تنجم توقفها بـ /idle off)")
          Write-Host "Access info sent to Telegram"

      - name: Install apps
        shell: pwsh
        continue-on-error: true
        run: |
          . C:\tg.ps1
          $apps = @("googlechrome","firefox","r.project","rstudio","vscode","git","7zip","python","notepadplusplus","vlc","googledrive","brave","dev-cpp","adobereader","wps-office-free","telegram","whatsapp","microsoft-windows-terminal")
          $failed = @()
          foreach ($app in $apps) {
            Write-Host "=== Installing $app ==="
            choco install $app -y --no-progress
            if ($LASTEXITCODE -ne 0) { $failed += $app }
          }
          if ($failed.Count -gt 0) { Write-Host "FAILED: $($failed -join ', ')"; Send-TG "⚠️ تطبيقات ما تثبّتوش: $($failed -join ', ')" } else { Write-Host "All apps installed" }
          exit 0

      - name: Restore extra apps
        shell: pwsh
        continue-on-error: true
        run: |
          . C:\tg.ps1
          if (Test-Path "extra-apps.txt") {
            $list = Get-Content "extra-apps.txt" | Where-Object { $_ }
            foreach ($app in $list) {
              Write-Host "=== Restoring $app ==="
              choco install $app -y --no-progress
            }
            Send-TG "📦 تم تثبيت التطبيقات المضافة سابقا: $($list -join ', ')"
          }
          # baseline : tout ce qui est installé à ce stade
          Get-ChildItem "C:\ProgramData\chocolatey\lib" -Directory | ForEach-Object { $_.Name } | Set-Content "C:\base-apps.txt"
          Send-TG "🔄 التحديثات والتثبيتات سالات. السيرفر جاهز. اكتب /help"
          exit 0

      - name: Desktop shortcut
        shell: pwsh
