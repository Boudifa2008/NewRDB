
name: Windows All-in-One Workspace

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Select Workspace Operation"
        required: true
        type: choice
        default: full
        options:
          - full
          - setup
          - backup
          - restore

      restore_run_id:
        description: "Previous GitHub Run ID"
        required: false
        type: string

      artifact_name:
        description: "Backup artifact name"
        required: false
        default: windows-backup
        type: string

      enable_tailscale:
        description: "Enable Tailscale"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  windows-workspace:
    name: Windows Workspace Manager
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      WORKSPACE_DIR: ${{ runner.temp }}/WindowsWorkspace

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Workspace
        shell: pwsh
        run: |
          New-Item -ItemType Directory `
            -Force -Path $env:WORKSPACE_DIR

          if (Test-Path "$env:GITHUB_WORKSPACE/workspace") {
            Copy-Item `
              "$env:GITHUB_WORKSPACE/workspace/*" `
              $env:WORKSPACE_DIR `
              -Recurse -Force
          }

          Write-Host "Workspace initialized."

      - name: Validate Restore
        if: ${{ inputs.operation == 'restore' }}
        shell: pwsh
        env:
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RESTORE_RUN_ID)) {
            throw "Previous Run ID is required."
          }

      - name: Restore Previous Backup
        if: ${{ inputs.operation == 'restore' || (inputs.operation == 'full' && inputs.restore_run_id != '') }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/WindowsWorkspace
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.restore_run_id }}

      - name: Install Applications
        if: ${{ inputs.operation == 'setup' || inputs.operation == 'full' }}
        shell: pwsh
        run: |
          $apps = @(
            "Git.Git",
            "Microsoft.VisualStudioCode",
            "Google.Chrome",
            "7zip.7zip",
            "VideoLAN.VLC",
            "Python.Python.3.13"
          )

          $failed = @()

          foreach ($app in $apps) {
            Write-Host "Installing: $app"

            winget install `
              --id $app `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Installation failed: $app"
              $failed += $app
            }
          }

          if ($failed.Count -gt 0) {
            Write-Warning "Some applications failed:"
            $failed | ForEach-Object {
              Write-Warning $_
            }
          }

      - name: Configure Tailscale
        if: ${{ inputs.enable_tailscale }}
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $msi = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $msi

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /quiet /norestart" `
            -Wait

          Remove-Item $msi -Force

          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $exe)) {
            throw "Tailscale installation failed."
          }

          Start-Service Tailscale `
            -ErrorAction SilentlyContinue

          & $exe up `
            "--authkey=$env:TS_AUTHKEY" `
            "--hostname=github-$env:GITHUB_RUN_ID" `
            "--accept-dns=false" `
            "--accept-routes=false"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          Write-Host "Tailscale connected."

          & $exe ip -4

      - name: Windows Diagnostics
        shell: pwsh
        run: |
          Write-Host "Windows Information"

          Get-ComputerInfo |
            Select-Object WindowsProductName,
                          WindowsVersion,
                          OsArchitecture

          Write-Host "Network Information"

          Get-NetIPConfiguration |
            Select-Object InterfaceAlias,
                          IPv4Address

          Write-Host "Disk Information"

          Get-PSDrive -PSProvider FileSystem

      - name: Prepare Backup
        if: ${{ inputs.operation != 'setup' }}
        shell: pwsh
        run: |
          $info = @"
          Windows Workspace Backup
          Date: $(Get-Date -Format o)
          Repository: $env:GITHUB_REPOSITORY
          Run ID: $env:GITHUB_RUN_ID
          Operation: ${{ inputs.operation }}
          "@

          $info | Out-File `
            "$env:WORKSPACE_DIR\backup-info.txt"

          Write-Host "Backup prepared."

      - name: Save Workspace Backup
        if: ${{ inputs.operation != 'setup' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-backup
          path: ${{ runner.temp }}/WindowsWorkspace/
          retention-days: 30
          if-no-files-found: error

      - name: Generate Report
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          @"
          # Windows Workspace Report

          - Repository: $env:GITHUB_REPOSITORY
          - Run ID: $env:GITHUB_RUN_ID
          - Operation: ${{ inputs.operation }}
          - Result: $env:JOB_STATUS
          - Date: $(Get-Date -Format o)

          Windows Workspace completed.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY
